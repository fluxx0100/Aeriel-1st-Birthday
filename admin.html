
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Race Control | Admin Dashboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --red: #e10613;
  --dark: #080808;
  --panel: #181818;
  --border: #333;
  --white: #fff;
  --gray: #aaa;
}

body {
  background: var(--dark);
  color: var(--white);
  font-family: Arial, sans-serif;
  padding: 20px 12px;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

.header {
  background: linear-gradient(120deg, #ed1725, #850008);
  padding: 30px 15px;
  text-align: center;
  border-radius: 10px;
  border-bottom: 5px solid white;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px #000;
}

.header h1 {
  font-size: 27px;
  font-weight: 900;
  font-style: italic;
}

.header p {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 4px;
}

.checkered {
  height: 18px;
  margin: 20px 0;
  background: repeating-conic-gradient(
    white 0% 25%,
    #111 0% 50%
  ) 0 0 / 20px 20px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-top: 5px solid var(--red);
  border-radius: 10px;
  padding: 25px 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px #000;
}

.panel h2 {
  font-size: 19px;
  font-style: italic;
  margin-bottom: 22px;
}

.password-wrap {
  position: relative;
}

input {
  width: 100%;
  padding: 17px 55px 17px 15px;
  border: 1px solid #444;
  border-radius: 7px;
  background: #080808;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: var(--red);
}

.eye {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: white;
  font-size: 23px;
  cursor: pointer;
  padding: 5px;
  width: auto;
  margin: 0;
  box-shadow: none;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 6px;
  background: var(--red);
  color: white;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 5px 0 #760008;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.message {
  margin-top: 18px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.error {
  color: #ff737a;
}

.success {
  color: #63e69a;
}

.hidden {
  display: none !important;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  background: #101010;
  border: 1px solid #383838;
  border-radius: 7px;
  padding: 17px 5px;
  text-align: center;
}

.stat strong {
  display: block;
  color: var(--red);
  font-size: 27px;
  margin-bottom: 7px;
}

.stat span {
  color: #aaa;
  font-size: 10px;
  letter-spacing: 1px;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.toolbar button {
  margin: 0;
  padding: 13px 5px;
  font-size: 11px;
}

.toolbar .secondary {
  background: #333;
  box-shadow: 0 4px 0 #111;
}

.guest-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.guest {
  background: #0c0c0c;
  border: 1px solid #383838;
  border-left: 4px solid var(--red);
  border-radius: 6px;
  padding: 14px;
  text-align: left;
}

.guest-name {
  font-size: 16px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.guest-status {
  display: inline-block;
  margin-top: 8px;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

.attending {
  color: #65e69b;
}

.not-attending {
  color: #ff737a;
}

.guest-time {
  color: #777;
  font-size: 11px;
  margin-top: 8px;
}

.empty {
  color: #999;
  text-align: center;
  padding: 25px 5px;
  font-size: 14px;
}

.back {
  display: block;
  text-align: center;
  color: #aaa;
  text-decoration: none;
  margin: 25px 0;
  font-size: 13px;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 10px;
  letter-spacing: 3px;
  padding: 15px;
}

@media (max-width: 380px) {
  .header h1 {
    font-size: 22px;
  }

  .stats {
    gap: 5px;
  }

  .stat strong {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1>🏁 RACE CONTROL</h1>
    <p>CELEBRATION ADMIN DASHBOARD</p>
  </header>

  <div class="checkered"></div>

  <!-- LOGIN -->
  <section class="panel" id="loginPanel">

    <h2>🔐 ADMIN LOGIN</h2>

    <div class="password-wrap">
      <input
        type="password"
        id="password"
        placeholder="Enter admin password"
        autocomplete="current-password"
      >

      <button
        type="button"
        class="eye"
        id="togglePassword"
        aria-label="Show password"
      >🙈</button>
    </div>

    <button type="button" id="loginBtn">
      ACCESS DASHBOARD 🏁
    </button>

    <div class="message" id="loginMessage" role="status"></div>

  </section>

  <!-- DASHBOARD -->
  <section class="hidden" id="dashboard">

    <div class="panel">

      <h2>🏁 RSVP OVERVIEW</h2>

      <div class="stats">

        <div class="stat">
          <strong id="totalCount">0</strong>
          <span>TOTAL</span>
        </div>

        <div class="stat">
          <strong id="yesCount">0</strong>
          <span>ATTENDING</span>
        </div>

        <div class="stat">
          <strong id="noCount">0</strong>
          <span>NOT ATTENDING</span>
        </div>

      </div>

      <div class="toolbar">

        <button type="button" id="refreshBtn">
          ↻ REFRESH
        </button>

        <button type="button" class="secondary" id="exportBtn">
          ↓ EXPORT CSV
        </button>

      </div>

      <div class="message" id="dashboardMessage" role="status"></div>

    </div>

    <div class="panel">

      <h2>👥 GUEST RESPONSES</h2>

      <div class="guest-list" id="guestList">
        <div class="empty">Loading responses...</div>
      </div>

    </div>

    <button type="button" id="logoutBtn">
      LOG OUT
    </button>

  </section>

  <div class="checkered"></div>

  <a href="index.html" class="back">
    ← BACK TO INVITATION
  </a>

  <div class="footer">
    RACE CONTROL SYSTEM • ADMIN ONLY
  </div>

</div>

<script>
"use strict";

/* USE THE SAME URL AS index.html */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyBDQmskEiF0z9T-VSzIwGGiQfAQklAlX7zvJNqVqGf0P5i3pnRIjGXvMu64QIkgh2C/exec";

/* ADMIN PASSWORD */

let adminPassword = "";
let guestResponses = [];

/* ELEMENTS */

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const loginMessage = document.getElementById("loginMessage");
const dashboardMessage = document.getElementById("dashboardMessage");
const guestList = document.getElementById("guestList");

/* JSONP REQUEST */

function callScript(params, callback) {

  const callbackName =
    "adminCallback_" +
    Date.now() +
    "_" +
    Math.random().toString(36).substring(2, 9);

  const script = document.createElement("script");

  let completed = false;
  let timeout;

  function cleanup() {
    clearTimeout(timeout);

    try {
      delete window[callbackName];
    } catch (error) {
      window[callbackName] = undefined;
    }

    script.onerror = null;

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  }

  function finish(data) {
    if (completed) return;

    completed = true;
    cleanup();
    callback(data);
  }

  window[callbackName] = function(data) {
    finish(data);
  };

  script.onerror = function() {
    finish({
      success: false,
      message: "Unable to connect to Google Apps Script. Check the deployment URL and permissions."
    });
  };

  const query = new URLSearchParams({
    ...params,
    callback: callbackName,
    _t: Date.now()
  });

  script.src = SCRIPT_URL + "?" + query.toString();
  script.async = true;

  timeout = setTimeout(function() {
    finish({
      success: false,
      message: "The server did not respond. Please try again."
    });
  }, 20000);

  document.body.appendChild(script);
}

/* PASSWORD VISIBILITY */

document.getElementById("togglePassword")
.addEventListener("click", function() {

  const isHidden = passwordInput.type === "password";

  passwordInput.type = isHidden ? "text" : "password";

  this.textContent = isHidden ? "🐵" : "🙈";

  this.setAttribute(
    "aria-label",
    isHidden ? "Hide password" : "Show password"
  );
});

/* LOGIN */

function login() {

  const enteredPassword = passwordInput.value.trim();

  if (!enteredPassword) {
    loginMessage.className = "message error";
    loginMessage.textContent = "Please enter your password.";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "CONNECTING...";
  loginMessage.className = "message";
  loginMessage.textContent = "Connecting to the RSVP database...";

  callScript({
    action: "list",
    password: enteredPassword
  }, function(data) {

    loginBtn.disabled = false;
    loginBtn.textContent = "ACCESS DASHBOARD 🏁";

    if (data && data.success === true) {

      adminPassword = enteredPassword;

      loginPanel.classList.add("hidden");
      dashboard.classList.remove("hidden");

      passwordInput.value = "";

      displayResponses(data.responses || []);

    } else {

      loginMessage.className = "message error";

      loginMessage.textContent =
        data && data.message
          ? data.message
          : "Login failed. Please check your password and try again.";

    }

  });
}

loginBtn.addEventListener("click", login);

passwordInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    login();
  }
});

/* DISPLAY GUEST RESPONSES */

function displayResponses(responses) {

  guestResponses = Array.isArray(responses) ? responses : [];

  const total = guestResponses.length;

  const yes = guestResponses.filter(function(item) {
    return String(item.attendance).toUpperCase() === "YES";
  }).length;

  const no = guestResponses.filter(function(item) {
    return String(item.attendance).toUpperCase() === "NO";
  }).length;

  document.getElementById("totalCount").textContent = total;
  document.getElementById("yesCount").textContent = yes;
  document.getElementById("noCount").textContent = no;

  guestList.innerHTML = "";

  if (total === 0) {

    guestList.innerHTML =
      '<div class="empty">No RSVP responses yet.</div>';

    return;
  }

  guestResponses.forEach(function(item) {

    const guest = document.createElement("div");
    guest.className = "guest";

    const name = document.createElement("div");
    name.className = "guest-name";
    name.textContent = item.name || "Unnamed guest";

    const status = document.createElement("div");

    const attendance =
      String(item.attendance || "").toUpperCase();

    status.className =
      "guest-status " +
      (attendance === "YES" ? "attending" : "not-attending");

    status.textContent =
      attendance === "YES"
        ? "✓ ATTENDING"
        : "✕ NOT ATTENDING";

    const time = document.createElement("div");
    time.className = "guest-time";

    if (item.timestamp) {
      const date = new Date(item.timestamp);

      time.textContent = isNaN(date.getTime())
        ? String(item.timestamp)
        : date.toLocaleString();
    } else {
      time.textContent = "";
    }

    guest.appendChild(name);
    guest.appendChild(status);
    guest.appendChild(time);

    guestList.appendChild(guest);

  });
}

/* REFRESH RESPONSES */

function refreshResponses() {

  const refreshBtn = document.getElementById("refreshBtn");

  refreshBtn.disabled = true;
  refreshBtn.textContent = "LOADING...";

  dashboardMessage.className = "message";
  dashboardMessage.textContent = "Updating guest responses...";

  callScript({
    action: "list",
    password: adminPassword
  }, function(data) {

    refreshBtn.disabled = false;
    refreshBtn.textContent = "↻ REFRESH";

    if (data && data.success === true) {

      displayResponses(data.responses || []);

      dashboardMessage.className = "message success";
      dashboardMessage.textContent = "Guest list updated successfully.";

    } else {

      dashboardMessage.className = "message error";
      dashboardMessage.textContent =
        data && data.message
          ? data.message
          : "Unable to refresh responses.";

    }

  });
}

document.getElementById("refreshBtn")
.addEventListener("click", refreshResponses);

/* EXPORT CSV */

document.getElementById("exportBtn")
.addEventListener("click", function() {

  if (guestResponses.length === 0) {
    dashboardMessage.className = "message error";
    dashboardMessage.textContent = "There are no responses to export.";
    return;
  }

  const rows = [
    ["Timestamp", "Guest Name", "Attendance"]
  ];

  guestResponses.forEach(function(item) {

    rows.push([
      item.timestamp || "",
      item.name || "",
      item.attendance || ""
    ]);

  });

  function escapeCSV(value) {
    return '"' + String(value).replace(/"/g, '""') + '"';
  }

  const csv = rows.map(function(row) {
    return row.map(escapeCSV).join(",");
  }).join("\r\n");

  const blob = new Blob(
    ["\uFEFF" + csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "Race_Day_RSVP_Responses.csv";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);

});

/* LOG OUT */

document.getElementById("logoutBtn")
.addEventListener("click", function() {

  adminPassword = "";
  guestResponses = [];

  dashboard.classList.add("hidden");
  loginPanel.classList.remove("hidden");

  loginMessage.className = "message";
  loginMessage.textContent = "";

  dashboardMessage.textContent = "";
  guestList.innerHTML = "";

  document.getElementById("totalCount").textContent = "0";
  document.getElementById("yesCount").textContent = "0";
  document.getElementById("noCount").textContent = "0";

});

</script>

</body>
</html>
